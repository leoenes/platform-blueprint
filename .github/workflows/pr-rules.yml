name: Repo / PR rules

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize] # `edited` so a fixed title re-runs

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  danger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes danger@13.0.10 ci --failOnErrors --no-publish-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
