name: Repo / checks

# Static checks that need no cloud: formatting, lint, chart rendering for
# every cluster file, the generated inventory, and a dry run of the staging
# logic. This is what the README badge reports.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: make check
