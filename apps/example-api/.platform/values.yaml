# App-owned deployment contract, rendered by the shared service chart.
name: example-api

image:
  repository: 666666666666.dkr.ecr.eu-west-2.amazonaws.com/example-api
  # tag: Image Updater (nonprod) or the promotion commit (prod)

port: 8080
healthCheck:
  path: /health

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }

autoscaling:
  minReplicas: 2
  maxReplicas: 10
  cpuUtilization: 70

rollout:
  strategy: blueGreen
  autoPromotionSeconds: 60

env:
  LOG_LEVEL: info

# Names in git, values in Secrets Manager.
secrets:
  DATABASE_URL: { key: svc/example-api/database, property: url }
  API_TOKEN: { key: svc/example-api/tokens, property: api }

database:
  name: example_api
  extensions: [pgcrypto]
