# App-owned deployment contract. The platform renders this through the shared
# service chart; the app team never writes Kubernetes YAML.
name: example-api

image:
  repository: 666666666666.dkr.ecr.eu-west-2.amazonaws.com/example-api
  # tag is set by Image Updater (nonprod) or the promotion commit (prod)

port: 8080
healthCheck:
  path: /health

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }

autoscaling:
  minReplicas: 2
  maxReplicas: 10
  cpuUtilization: 70

rollout:
  strategy: blueGreen
  autoPromotionSeconds: 60

env:
  LOG_LEVEL: info

# Secret *names* live in git, values live in Secrets Manager.
secrets:
  DATABASE_URL: { key: svc/example-api/database, property: url }
  API_TOKEN: { key: svc/example-api/tokens, property: api }

database:
  name: example_api
  extensions: [pgcrypto]
