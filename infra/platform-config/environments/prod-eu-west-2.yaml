global:
  stage: prod
  region: eu-west-2
  accountId: "333333333333"
  clusterName: prod-uk
  ecrRegistry: 666666666666.dkr.ecr.eu-west-2.amazonaws.com
  baseDomain: uk.example.com

preview:
  enabled: false

disabledTools: [argocd-image-updater] # prod tags come from promotion commits, never from a watcher
disabledServices: []

karpenter:
  version: 1.15.1
  capacityTypes: [on-demand]
  instanceFamilies: [m6i, m7i]

databases:
  - example_api

dbSnapshot:
  enabled: true
  schedule: "0 */4 * * *"
  bucket: acme-prod-uk-db-snapshots
