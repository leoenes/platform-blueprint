# One file per cluster: first values file for platform-apps and every app,
# and the source the ApplicationSets are rendered from.
global:
  stage: nonprod
  region: eu-west-2
  accountId: "111111111111"
  clusterName: nonprod-uk
  ecrRegistry: 666666666666.dkr.ecr.eu-west-2.amazonaws.com
  baseDomain: uk.nonprod.example.com
  previewDomainSuffix: preview.uk.nonprod.example.com

preview:
  enabled: true
  default: true

disabledTools: []
disabledServices: []

karpenter:
  version: 1.15.1
  capacityTypes: [spot, on-demand]
  instanceFamilies: [m6i, m6a, m7i, c6i]

databases:
  - example_api

dbSnapshot:
  enabled: true
  schedule: "0 2,14 * * *"
  bucket: acme-nonprod-uk-db-snapshots
