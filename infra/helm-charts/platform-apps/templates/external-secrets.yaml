{{- if include "platform.enabled" (list "external-secrets" .Values) }}
# Wave -1 operator; the wave-0 ClusterSecretStore below needs its CRD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  {{- include "platform.appMeta" . | nindent 2 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.externalSecrets.version | quote }}
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.global.region }}
      # Pod Identity association from the eks layer.
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
{{- end }}
